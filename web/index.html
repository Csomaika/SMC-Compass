<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="compass-session" content="__LOCAL_SESSION__">
<title>SMC Compass</title>
<link rel="icon" href="/brand.svg">
<link rel="stylesheet" href="/style.css">
<script src="/ui.js" defer></script>
</head>
<body>
<aside class="sidebar">
  <div class="brand"><img src="/brand.svg" alt=""><div><strong>SMC <span>Compass</span></strong><small>PSD SALES WORKSPACE</small></div></div>
  <nav aria-label="Főmenü">
    <button data-tab="overview" class="selected"><span data-icon="dashboard"></span> Áttekintés</button>
    <button data-tab="input"><span data-icon="edit"></span> Havi adatbevitel</button>
    <button data-tab="matrix"><span data-icon="grid"></span> 9-box vevőmátrix</button>
    <button data-tab="pipeline"><span data-icon="stack"></span> Sugar pipeline</button>
    <button data-tab="sources"><span data-icon="settings"></span> Források</button>
  </nav>
  <div class="sidebar-bottom"><span class="live-fob"></span><div><strong>Helyi munkaterület</strong><small id="sideMode">Adatforrások betöltése</small></div></div>
</aside>
<main class="workspace">
  <header class="topbar"><div class="breadcrumb"><span>PSD</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><strong id="crumb">Áttekintés</strong></div><div class="toolbar"><button class="button secondary" id="refresh"><span data-icon="refresh"></span><span>Frissítés</span></button><button class="button primary" id="export"><span data-icon="download"></span><span>Excel-export</span></button></div></header>
  <section id="screen" class="screen" aria-live="off"><p class="loading">A munkaterület betöltése…</p></section>
</main>
<div id="toast" role="status" class="toast" hidden></div>
<dialog id="dialog"><form method="dialog" id="modal"></form></dialog>
</body>
</html>
